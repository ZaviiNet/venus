<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Permissive D-Bus system bus configuration for the Venus OS Docker container.

  Venus OS daemons (dbus-systemcalc-py, dbus-mqtt, etc.) all communicate over
  the system bus.  Inside Docker there is no host system bus, so we run our own
  dbus-daemon with this config and place the socket at the standard Linux path
  /run/dbus/system_bus_socket so dbus clients can find it without any extra
  environment variables.

  Security note: all connections are from trusted processes within the same
  container, so a wide-open policy is acceptable here.
-->

<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>

  <!-- Allow every process to connect, own names, and exchange messages. -->
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
    <allow send_type="signal"/>
    <allow send_type="method_call"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>

  <!-- Remove per-connection limits that would throttle Venus telemetry. -->
  <limit name="max_incoming_bytes">0</limit>
  <limit name="max_message_size">0</limit>
  <limit name="max_replies_per_connection">0</limit>
  <limit name="max_match_rules_per_connection">0</limit>
  <limit name="max_names_per_connection">0</limit>
</busconfig>
